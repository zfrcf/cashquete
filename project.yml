name: CashQuest
options:
  bundleIdPrefix: com.antoine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
targets:
  CashQuest:
    type: application
    platform: iOS
    sources:
      - CashQuest
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoine.cashquest
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: -ObjC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CashQuest/Info.plist
      properties:
        CFBundleDisplayName: CashQuest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: ca-app-pub-9250992440448321~2815719221
        NSUserTrackingUsageDescription: Cet identifiant sert à vous proposer des publicités plus pertinentes.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
